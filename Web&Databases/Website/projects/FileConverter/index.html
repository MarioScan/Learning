<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>File Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <p class="brand">File Converter</p>
  <p class="tag">Private, in-browser file conversion</p>
  <nav id="nav"></nav>
  <section class="priv" aria-labelledby="privacy-title">
    <h2 id="privacy-title">Your Privacy Is Our Priority</h2>
    <p>Runs offline. Your files stay on this device.</p>
  </section>
</aside>
<main id="main">
  <section id="toolView">
  <h1 id="t"></h1>
  <p class="lead" id="d"></p>
  <label class="drop" id="drop"><strong id="dt">Drop files here or click to browse</strong><span id="ds"></span><input type="file" id="fi"></label>
  <div class="opts" id="opts"></div>
  <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>
  <section class="pdf-workspace" id="pdfWorkspace" hidden></section>
  <section class="pdf-workspace" id="gifWorkspace" hidden></section>
  <section class="pdf-workspace" id="cutWorkspace" hidden></section>
  <ul id="list"></ul>
  </section>
  <section class="privacy-page" id="privacyPage" hidden aria-labelledby="privacy-page-title">
    <button class="privacy-back" id="privacyBack" type="button">Back to converter</button>
    <h1 id="privacy-page-title">Data treatment &amp; privacy</h1>
    <p class="lead" id="privacyIntro"></p>
    <div class="privacy-details" id="privacyDetails"></div>
    <button class="pdf-action" id="clearSession" type="button">Clear this session</button>
  </section>
</main>
<footer class="site-footer">
  <button class="footer-link" id="privacyOpen" type="button">Data treatment &amp; privacy</button>
  <span>Powered by <a href="https://marioscan.github.io/Learning/" target="_blank" rel="noopener noreferrer">MarioScan</a></span>
</footer>
<script src="script.js"></script>
</body>
</html>
