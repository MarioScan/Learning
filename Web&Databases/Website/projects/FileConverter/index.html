<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officina · convertitori locali</title>
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d5dbe1;--acc:#0b6b63;--accbg:#e1f1ef;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8edf1;--mut:#93a1ad;--line:#2a3742;--acc:#4fc3b7;--accbg:#173a38;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:2rem 1.25rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.25rem}
.brand{font:600 1.6rem/1.1 Georgia,"Iowan Old Style",serif;margin:0 .5rem .25rem}
.tag{color:var(--mut);font-size:.8rem;margin:0 .5rem 1.5rem}
nav button{all:unset;box-sizing:border-box;width:100%;padding:.6rem .75rem;border-radius:8px;cursor:pointer;display:block;color:var(--mut)}
nav button b{display:block;color:var(--ink);font-weight:600}
nav button small{font-size:.78rem}
nav button:hover{background:var(--card)}
nav button[aria-current=true]{background:var(--card);box-shadow:inset 3px 0 var(--acc)}
nav button:focus-visible,.drop:focus-within,select:focus-visible,.go:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav button[disabled]{opacity:.5;cursor:default}
.priv{margin-top:auto;font-size:.78rem;color:var(--mut);padding:.75rem;border:1px dashed var(--line);border-radius:8px}
main{padding:3rem clamp(1rem,5vw,4rem);max-width:820px;width:100%}
h1{font:600 2rem/1.15 Georgia,"Iowan Old Style",serif;margin:0 0 .5rem}
.lead{color:var(--mut);margin:0 0 2rem;max-width:60ch}
.drop{display:block;border:2px dashed var(--line);background:var(--card);border-radius:14px;padding:3rem 1.5rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--acc);background:var(--accbg)}
.drop strong{display:block;font-size:1.05rem}
.drop span{color:var(--mut);font-size:.85rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.opts{display:flex;gap:.75rem;align-items:center;margin:1.25rem 0;flex-wrap:wrap}
select{font:inherit;padding:.45rem .6rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.go{font:inherit;font-weight:600;border:0;border-radius:8px;padding:.5rem 1rem;background:var(--acc);color:var(--bg);cursor:pointer}
ul{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.5rem}
li{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem}
li b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.st{color:var(--mut);font-size:.82rem;white-space:nowrap}.st.err{color:var(--err)}
a.dl{color:var(--acc);font-weight:600;text-decoration:none;white-space:nowrap}a.dl:hover{text-decoration:underline}
.note{margin-top:2rem;font-size:.82rem;color:var(--mut);border-left:3px solid var(--line);padding-left:.9rem;max-width:62ch}
@media(max-width:760px){body{grid-template-columns:1fr}aside{position:static;height:auto;border:0;border-bottom:1px solid var(--line)}nav{display:grid;grid-template-columns:1fr 1fr}.priv{display:none}}
</style>
</head>
<body>
<aside>
  <p class="brand">Officina</p>
  <p class="tag">Convertitori che restano nel tuo browser</p>
  <nav id="nav"></nav>
  <p class="priv">Nessun file lascia questo dispositivo. Nessuna libreria esterna, nessuna richiesta di rete.</p>
</aside>
<main>
  <h1 id="t"></h1>
  <p class="lead" id="d"></p>
  <label class="drop" id="drop"><strong id="dt">Trascina i file qui o clicca per sceglierli</strong><span id="ds"></span><input type="file" id="fi"></label>
  <div class="opts" id="opts"></div>
  <ul id="list"></ul>
  <p class="note" id="note"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const enc=new TextEncoder();
const base=n=>n.replace(/\.[^.]+$/,'');
const loadImg=f=>createImageBitmap(f);
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function canvasOf(f,white){const b=await loadImg(f);const c=document.createElement('canvas');c.width=b.width;c.height=b.height;const x=c.getContext('2d');if(white){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(b,0,0);return c}

/* ---------- Immagini: JPG/PNG/WebP ---------- */
async function convImg(f,o){
  const mime=o.fmt,c=await canvasOf(f,mime==='image/jpeg');
  return {blob:await toBlob(c,mime,.92),name:base(f.name)+'.'+{'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[mime]};
}

/* ---------- Immagini -> PDF (scritto a mano, JPEG incorporato) ---------- */
async function imgToPdf(files){
  const parts=[],off=[];let len=0;
  const add=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(id,fn)=>{off[id]=len;add(id+' 0 obj\n');fn();add('\nendobj\n')};
  const pages=[];
  for(const f of files){
    const c=await canvasOf(f,true);
    pages.push({w:c.width,h:c.height,jpg:new Uint8Array(await(await toBlob(c,'image/jpeg',.9)).arrayBuffer())});
  }
  const n=pages.length;
  add('%PDF-1.4\n');
  obj(1,()=>add('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>add(`<</Type/Pages/Count ${n}/Kids[${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]>>`));
  pages.forEach((p,i)=>{
    const W=Math.round(p.w*.75),H=Math.round(p.h*.75),pid=3+3*i;
    obj(pid,()=>add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Contents ${pid+1} 0 R/Resources<</XObject<</Im0 ${pid+2} 0 R>>>>>>`));
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(pid+1,()=>add(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`));
    obj(pid+2,()=>{add(`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.jpg.length}>>\nstream\n`);add(p.jpg);add('\nendstream')});
  });
  const total=3+3*n,xref=len;
  add(`xref\n0 ${total}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  return {blob:new Blob(parts,{type:'application/pdf'}),name:'immagini.pdf'};
}

/* ---------- Audio da video/audio -> WAV ---------- */
async function toWav(f){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  let buf;try{buf=await ctx.decodeAudioData(await f.arrayBuffer())}catch{throw new Error('Formato o codec non decodificabile dal browser')}
  const ch=buf.numberOfChannels,n=buf.length,out=new DataView(new ArrayBuffer(44+n*ch*2));
  const s=(o,t)=>[...t].forEach((c,i)=>out.setUint8(o+i,c.charCodeAt(0)));
  s(0,'RIFF');out.setUint32(4,36+n*ch*2,true);s(8,'WAVEfmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,ch,true);
  out.setUint32(24,buf.sampleRate,true);out.setUint32(28,buf.sampleRate*ch*2,true);out.setUint16(32,ch*2,true);out.setUint16(34,16,true);s(36,'data');out.setUint32(40,n*ch*2,true);
  const d=[...Array(ch)].map((_,i)=>buf.getChannelData(i));let p=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,d[c][i]));out.setInt16(p,v<0?v*32768:v*32767,true);p+=2}
  ctx.close();return {blob:new Blob([out],{type:'audio/wav'}),name:base(f.name)+'.wav'};
}

/* ---------- Markdown -> DOC (HTML compatibile con Word) ---------- */
function md2html(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/!?\[([^\]]*)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  const out=[];let list=null,code=null,para=[];
  const flushP=()=>{if(para.length)out.push('<p>'+inl(para.join(' '))+'</p>');para=[]};
  const flushL=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const line of src.replace(/\r/g,'').split('\n')){
    if(/^```/.test(line)){if(code){out.push('<pre>'+esc(code.join('\n'))+'</pre>');code=null}else{flushP();flushL();code=[]}continue}
    if(code){code.push(line);continue}
    let m;
    if(!line.trim()){flushP();flushL()}
    else if(m=line.match(/^(#{1,6})\s+(.*)/)){flushP();flushL();out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`)}
    else if(/^(-{3,}|\*{3,})$/.test(line.trim())){flushP();flushL();out.push('<hr>')}
    else if(m=line.match(/^\s*([-*+]|\d+\.)\s+(.*)/)){flushP();const t=/\d/.test(m[1])?'ol':'ul';if(list!==t){flushL();out.push(`<${t}>`);list=t}out.push('<li>'+inl(m[2])+'</li>')}
    else if(m=line.match(/^>\s?(.*)/)){flushP();flushL();out.push('<blockquote>'+inl(m[1])+'</blockquote>')}
    else para.push(line.trim());
  }
  flushP();flushL();return out.join('\n');
}
async function mdToDoc(f){
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Calibri,sans-serif;font-size:11pt}pre,code{font-family:Consolas,monospace;background:#f2f2f2}blockquote{border-left:3px solid #999;margin-left:0;padding-left:10pt;color:#555}</style></head><body>${md2html(await f.text())}</body></html>`;
  return {blob:new Blob(['\ufeff',html],{type:'application/msword'}),name:base(f.name)+'.doc'};
}

/* ---------- TTF -> WOFF2 (Brotli "store": valido, non compresso) ---------- */
const KT=['cmap','head','hhea','hmtx','maxp','name','OS/2','post','cvt ','fpgm','glyf','loca','prep','CFF ','VORG','EBDT','EBLC','gasp','hdmx','kern','LTSH','PCLT','VDMX','vhea','vmtx','BASE','GDEF','GPOS','GSUB','EBSC','JSTF','MATH','CBDT','CBLC','COLR','CPAL','SVG ','sbix','acnt','avar','bdat','bloc','bsln','cvar','fdsc','feat','fmtx','fvar','gvar','hsty','just','lcar','mort','morx','opbd','prop','trak','Zapf','Silf','Glat','Gloc','Feat','Sill'];
const pad4=n=>(n+3)&~3;
function u128(v){const b=[v&127];while((v>>>=7))b.unshift((v&127)|128);return b}
function brotliStore(data){
  const out=[];
  for(let p=0;p<data.length;p+=32768){
    const c=data.subarray(p,p+32768),sh=p===0?1:0,h=((c.length-1)<<(sh+3))|(1<<(sh+19));
    out.push(new Uint8Array([h&255,(h>>8)&255,(h>>16)&255]),c);
  }
  out.push(new Uint8Array([3]));return new Blob(out);
}
async function ttfToWoff2(f){
  const buffer=await f.arrayBuffer(),src=new DataView(buffer),bytes=new Uint8Array(buffer),flavor=src.getUint32(0);
  if(flavor===0x74746366)throw new Error('Le collezioni TTC non sono supportate');
  if(![0x00010000,0x74727565,0x4f54544f].includes(flavor))throw new Error('Non sembra un file TTF/OTF valido');
  const nt=src.getUint16(4);let tb=[];
  for(let i=0;i<nt;i++){const r=12+i*16;tb.push({tag:String.fromCharCode(...bytes.subarray(r,r+4)),offset:src.getUint32(r+8),length:src.getUint32(r+12)})}
  const loca=tb.find(t=>t.tag==='loca');
  if(loca){tb=tb.filter(t=>t!==loca);tb.splice(tb.findIndex(t=>t.tag==='glyf')+1,0,loca)}
  const dir=[];let sfnt=12+16*nt,ds=0;
  for(const t of tb){const i=KT.indexOf(t.tag),nul=t.tag==='glyf'||t.tag==='loca'?192:0;
    dir.push(i<0?63:i|nul);if(i<0)for(let k=0;k<4;k++)dir.push(t.tag.charCodeAt(k));
    dir.push(...u128(t.length));sfnt+=pad4(t.length);ds+=t.length}
  const td=new Uint8Array(ds);let p=0;
  for(const t of tb){td.set(bytes.subarray(t.offset,t.offset+t.length),p);p+=t.length}
  const comp=brotliStore(td),total=pad4(48+dir.length+comp.size),h=new DataView(new ArrayBuffer(48));
  h.setUint32(0,0x774f4632);h.setUint32(4,flavor);h.setUint32(8,total);h.setUint16(12,nt);h.setUint32(16,sfnt);h.setUint32(20,comp.size);
  return {blob:new Blob([h,new Uint8Array(dir),comp,new Uint8Array(total-48-dir.length-comp.size)],{type:'font/woff2'}),name:base(f.name)+'.woff2'};
}

/* ---------- Registro strumenti ---------- */
const TOOLS=[
 {id:'img',n:'Immagini',s:'JPG · PNG · WebP',accept:'image/*',multi:true,each:true,run:convImg,
  d:'Converti tra JPG, PNG e WebP. Le trasparenze diventano sfondo bianco quando l\'output è JPG.',
  opts:[['Converti in',[['image/png','PNG'],['image/jpeg','JPG'],['image/webp','WebP']],'fmt']]},
 {id:'pdf',n:'Immagini in PDF',s:'Una pagina per immagine',accept:'image/*',multi:true,run:imgToPdf,
  d:'Unisci una o più immagini in un unico PDF. L\'ordine è quello di selezione.'},
 {id:'aud',n:'Audio da video',s:'MP4 · MP3 → WAV',accept:'audio/*,video/*',multi:true,each:true,run:toWav,
  d:'Estrai la traccia audio da un video o decodifica un MP3 in WAV non compresso.',
  note:'Il browser non può codificare MP3 né creare MP4 senza un encoder: servono lamejs (MP3) o ffmpeg.wasm (MP4). Metti i file nella cartella e li collego.'},
 {id:'md',n:'Markdown in DOC',s:'.md → .doc',accept:'.md,.markdown,.txt',multi:true,each:true,run:mdToDoc,
  d:'Titoli, elenchi, grassetto, corsivo, codice, citazioni e link diventano un documento apribile con Word.',
  note:'Il percorso inverso (.doc/.docx → .md) richiede un lettore di archivi ZIP/OOXML: non incluso in questa versione.'},
 {id:'ttf',n:'Font',s:'TTF → WOFF2',accept:'.ttf,.otf',multi:true,each:true,run:ttfToWoff2,
  d:'Converti font TrueType in WOFF2 per il web.',
  note:'Il file è un WOFF2 valido ma non compresso (Brotli "store"): pesa quanto l\'originale. Per la compressione reale serve brotli-wasm. WOFF2 → TTF non incluso.'},
 {id:'mrg',n:'Unisci PDF',s:'In arrivo',off:true}
];
let cur=TOOLS[0],opt={};
const nav=$('nav');
TOOLS.forEach(t=>{const b=document.createElement('button');b.innerHTML=`<b>${t.n}</b><small>${t.s}</small>`;if(t.off)b.disabled=true;b.onclick=()=>pick(t);t.el=b;nav.append(b)});
function pick(t){
  cur=t;opt={};TOOLS.forEach(x=>x.el.setAttribute('aria-current',x===t));
  $('t').textContent=t.n;$('d').textContent=t.d;$('note').textContent=t.note||'';$('note').hidden=!t.note;
  $('fi').accept=t.accept;$('fi').multiple=t.multi;$('list').innerHTML='';
  $('ds').textContent=t.s;
  const o=$('opts');o.innerHTML='';
  (t.opts||[]).forEach(([lab,vals,key])=>{const l=document.createElement('label');l.textContent=lab+' ';const s=document.createElement('select');
    vals.forEach(([v,x])=>s.add(new Option(x,v)));opt[key]=vals[0][0];s.onchange=()=>opt[key]=s.value;l.append(s);o.append(l)});
}
const fi=$('fi'),drop=$('drop');
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>e.preventDefault());
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');run([...e.dataTransfer.files])};
fi.onchange=()=>{run([...fi.files]);fi.value=''};
function row(name){const li=document.createElement('li'),b=document.createElement('b'),s=document.createElement('span');b.textContent=name;s.className='st';s.textContent='Conversione in corso…';li.append(b,s);$('list').append(li);return {li,s}}
function done(r,res){const a=document.createElement('a');a.className='dl';a.href=URL.createObjectURL(res.blob);a.download=res.name;
  a.textContent=`Scarica ${res.name} (${(res.blob.size/1024).toFixed(0)} KB)`;r.s.replaceWith(a)}
function fail(r,e){r.s.textContent='Errore: '+e.message;r.s.classList.add('err')}
async function run(files){
  if(!files.length)return;const t=cur;
  if(t.each){for(const f of files){const r=row(f.name);try{done(r,await t.run(f,opt))}catch(e){fail(r,e)}}}
  else{const r=row(files.length+' file');try{done(r,await t.run(files,opt))}catch(e){fail(r,e)}}
}
pick(TOOLS[0]);
</script>
</body>
</html>
